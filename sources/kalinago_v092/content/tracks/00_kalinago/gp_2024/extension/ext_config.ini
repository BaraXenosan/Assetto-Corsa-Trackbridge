STARTING_POINT =-544.5, 99, -228.1 ; for unlooped paths, start here and move to another end
INVERT_DIRECTION = 1          ; for looped paths
TICK_TOCK_MODE = 0            ; set to 1 to go forwards and backwards
CUBIC_INTERPOLATION = 1       ; set to 1 for smoother movement (recommended)
SPEED_KMH = 110               ; basic train speed*
DELAY_BETWEEN_RUNS = 0, 0     ; min and max boundaries for a random delay between runs, in seconds
DEBUG_PATH = 0                ; set to 1 to highlight resulting path

