[GRASS_FX]
GRASS_MESHES = ?grasa?, ?grasb?, ?grasc?, ?grasd?
GRASS_MATERIALS = 
OCCLUDING_MESHES = a_line?, ?curb?, ?rail?, ?wall?, ?tires?
ORIGINAL_GRASS_MATERIALS = 
TRIM_PERIOD = THURSDAY
MASK_BLUR = 1
MASK_MAIN_THRESHOLD = 0.5 ; how saturated (with green) should the surface be (not real saturation, could be more than 1)
MASK_RED_THRESHOLD = 0    ; offsets target color from green to yellow and red, if set high enough
MASK_MIN_LUMINANCE = 0    ; minimum luminance to spawn grass on
MASK_MAX_LUMINANCE = 1    ; maximum luminance
SHAPE_SIZE = 1            ; general size
SHAPE_TIDY = 0            ; how tidy grass is (untidy grass in uneven, tilted more)
SHAPE_CUT = 0             ; how cut grass is
SHAPE_WIDTH = 1           ; grass width relative to its height
COLOR_FACTOR = 1
TEXTURE = grass_fx/highlands.dds
TEXTURE_GRID = 8, 3

[GRASS_FX_TEXTURE_GROUP_0]
PIECE_0 = 1, 1             ; first piece stars with cell at (1, 1), that piece with a single yellow flower
PIECE_0_CHANCE = 0 
PIECE_1 = 2, 1             ; second piece, takes a single cell as well
PIECE_1_CHANCE = 0
PIECE_2 = 1, 2, 2, 1       ; third piece, with yellow and white flower, taking 21 slots
PIECE_2_CHANCE = 0
PIECE_3 = 3, 1, 1, 2       ; piece taking 12 slots, the one with purple flowers
PIECE_3_CHANCE = 0
PIECE_3_SIZE_MULT = 1.2, 2 ; default size multiplier is based on size in cells, overriding
PIECE_3_WIND = 0.5         ; less affected by wind (default value is 1)

[GRASS_FX_TEXTURE_GROUP_1]
PIECE_0 = 1, 1             ; first piece stars with cell at (1, 1), that piece with a single yellow flower
PIECE_0_CHANCE = 0         ; 

PIECE_1 = 2, 1             ; second piece, takes a single cell as well
PIECE_1_CHANCE = 0         ; would appear 10 times less often then first two pieces

PIECE_2 = 3, 1.5, 1, 1       ; third piece, with yellow and white flower, taking 21 slots
PIECE_2_CHANCE = 0         ; would appear 10 times less often then first two pieces

PIECE_3 = 4, 1, 2, 2       ; piece taking 12 slots, the one with purple flowers
PIECE_3_SIZE_MULT = 1, 1.1 ; default size multiplier is based on size in cells, overriding
PIECE_3_WIND = 0.5         ; less affected by wind (default value is 1)
PIECE_3_CHANCE = 1         ; would appear 100 times less often

[GRASS_FX_TEXTURE_GROUP_2]
PIECE_0 = 1, 1             ; first piece stars with cell at (1, 1), that piece with a single yellow flower
PIECE_0_CHANCE = 0         ; 

PIECE_1 = 2, 1             ; second piece, takes a single cell as well
PIECE_1_CHANCE = 0         ; would appear 10 times less often then first two pieces

PIECE_2 = 8, 1             ; third piece, with yellow and white flower, taking 21 slots
PIECE_2_CHANCE = 0.5         ; would appear 10 times less often then first two pieces

PIECE_3 = 4, 1, 2, 2       ; piece taking 12 slots, the one with purple flowers
PIECE_3_SIZE_MULT = 1, 1.1 ; default size multiplier is based on size in cells, overriding
PIECE_3_WIND = 0.5         ; less affected by wind (default value is 1)
PIECE_3_CHANCE = 0.4       ; would appear 100 times less often

